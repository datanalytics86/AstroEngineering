name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + verify_corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run backend test suite
        run: pytest backend/tests

      - name: Verify historical corpus against Swiss Ephemeris
        working-directory: backend
        run: python scripts/verify_corpus.py

  frontend:
    name: Frontend (i18n parity + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check i18n key parity (es/en)
        run: npm run check:i18n

      - name: Build (static type-check + Next.js build)
        env:
          NEXT_PUBLIC_API_URL: https://astroengine-backend.onrender.com
        run: npm run build

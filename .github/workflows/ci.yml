name: CI

on:
  push:
    branches: [main, "release/v1-*", "v1/**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + corpus + pip-audit)
    runs-on: ubuntu-latest
    env:
      EPHE_PATH: ${{ github.workspace }}/ephe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest pip-audit

      - name: Fetch Swiss Ephemeris (Anexo C)
        run: python backend/scripts/fetch_ephe.py

      - name: pip-audit
        run: pip-audit -r backend/requirements.txt --progress-spinner off

      - name: Run backend test suite
        run: pytest backend/tests -q

      - name: Verify historical corpus against Swiss Ephemeris
        working-directory: backend
        run: python scripts/verify_corpus.py

  frontend:
    name: Frontend (lint, typecheck, vitest, i18n, interp, audit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check i18n key parity (es/en)
        run: npm run check:i18n

      - name: Check advanced natal synthesis
        run: npm run check:interp

      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://astroengine-backend.onrender.com
          NEXT_PUBLIC_SITE_URL: https://astro-engineering.vercel.app
        run: npm run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://astroengine-backend.onrender.com
          NEXT_PUBLIC_SITE_URL: https://astro-engineering.vercel.app
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke
        env:
          NEXT_PUBLIC_API_URL: https://astroengine-backend.onrender.com
          NEXT_PUBLIC_SITE_URL: https://astro-engineering.vercel.app
        run: npx playwright test

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

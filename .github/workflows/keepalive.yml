name: Keepalive backend

# El backend corre en Render free tier, que hiberna tras ~15 min de
# inactividad; el cold start tras hibernar toma ~50s y degrada la primera
# visita real de un usuario (ver GAP_ANALYSIS_DEPLOY.md, A-4). Este workflow
# hace un ping periódico a /health para mantenerlo despierto. No debe fallar
# el workflow si el backend tarda o está temporalmente caído (`|| true`):
# esto es solo un keepalive best-effort, no un chequeo de salud con alertas.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: Curl backend health endpoint
        run: curl -sf -m 30 https://astroengine-backend.onrender.com/health || true
